name: Update Packages

on:
  push:
    paths:
      - 'pool/**'
      - 'lib/**'
      - 'include/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate new auto-section
        run: |
          # Генерируем только содержимое для авто-секции
          {
            echo "###AUTO_START###"
            
            find pool/main -type f | sort | while read f; do
              if [ -f "$f" ]; then
                rel="${f#pool/main/}"
                # Игнорируем мусор GCC
                if echo "$f" | grep -q 'pool/main/lib/a/gcc/'; then continue; fi

                # Логика определения типа (твоя старая)
                is_libc="no"
                if echo "$rel" | grep -qE '^lib/so/'; then type="so"; destdir="lib"; pkgname=$(basename "$f"); is_libc="yes"
                elif echo "$rel" | grep -qE '^lib/a/'; then type="a"; destdir="lib"; pkgname=$(basename "$f"); is_libc="yes"
                elif echo "$f" | grep -qE '\.tar\.gz$'; then
                    type="dir"; pkgname=$(basename "$f" .tar.gz)
                    destdir=$([ "$pkgname" = "gcc" ] && echo "/" || echo "bin")
                else
                    name=$(basename "$f")
                    case "$name" in
                        *.a) type="lib"; destdir="lib" ;;
                        *.so|*.so.*|ld-musl-*) type="so"; destdir="lib" ;;
                        *.la) type="la"; destdir="lib" ;;
                        *.h|*.hpp) type="dev"; destdir="include" ;;
                        *) type="bin"; destdir="bin" ;;
                    esac
                    pkgname="$name"
                fi

                [ "$pkgname" = "ld-musl-x86_64.so.1" ] && destdir="lib" && is_libc="yes"

                size=$(stat -c%s "$f")
                md5=$(md5sum "$f" | cut -d' ' -f1)

                echo "Package: $pkgname"
                echo "Version: 1.0"
                echo "Type: $type"
                echo "Filename: $f"
                echo "Size: $size"
                echo "MD5sum: $md5"
                echo "DestDir: $destdir"
                echo "libc: $is_libc"
                echo ""
              fi
            done
            echo "###AUTO_END###"
          } > auto_section.new

      - name: Update Packages file
        run: |
          # Если файла нет, создаем базовую структуру
          if [ ! -f Packages ]; then
            echo "# Manual header here" > Packages
            cat auto_section.new >> Packages
            echo "# Manual footer here" >> Packages
          else
            # Используем Perl для точечной замены блока между маркерами
            # -0777 считывает весь файл, s/// заменяет блок целиком
            perl -i -0777 -pe 's/###AUTO_START###.*?###AUTO_END###/`cat auto_section.new`/e' Packages
          fi
          rm -f auto_section.new

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update Packages"
            git push
          else
            echo "No changes detected"
          fi
