name: Update Packages

on:
  push:
    paths:
      - 'pool/**'
      - 'lib/**'
      - 'include/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate temporary new Packages file
        run: |
          # Создаем временный файл с новыми данными
          echo "# WPM Packages" > Packages.new
          echo "# Auto-generated by GitHub Actions" >> Packages.new
          echo "# Manual edits outside of ###AUTO### blocks are preserved" >> Packages.new
          echo "" >> Packages.new
          echo "###AUTO_START###" >> Packages.new

          # Ищем файлы в pool/main
          find pool/main -type f | sort | while read f; do
            if [ -f "$f" ]; then
              rel="${f#pool/main/}"

              # ИГНОРИРУЕМ внутренний мусор GCC
              if echo "$f" | grep -q 'pool/main/lib/a/gcc/'; then
                continue
              fi

              is_libc="no"

              # --- Библиотеки из libc ---
              if echo "$rel" | grep -qE '^lib/so/'; then
                type="so"
                destdir="lib"
                pkgname=$(basename "$f")
                is_libc="yes"
              elif echo "$rel" | grep -qE '^lib/a/'; then
                type="a"
                destdir="lib"
                pkgname=$(basename "$f")
                is_libc="yes"
              else
                # --- Обычные пакеты ---
                if echo "$f" | grep -qE '\.tar\.gz$'; then
                  type="dir"
                  pkgname=$(basename "$f" .tar.gz)
                  
                  if [ "$pkgname" = "gcc" ]; then
                    destdir="/"
                  else
                    destdir="bin"
                  fi
                else
                  name=$(basename "$f")
                  case "$name" in
                    *.a)
                      type="lib"
                      destdir="lib"
                      ;;
                    *.so|*.so.*|ld-musl-*)
                      type="so"
                      destdir="lib"
                      ;;
                    *.la)
                      type="la"
                      destdir="lib"
                      ;;
                    *.h|*.hpp)
                      type="dev"
                      destdir="include"
                      ;;
                    *)
                      type="bin"
                      destdir="bin"
                      ;;
                  esac
                  pkgname="$name"
                fi
              fi

              # Фикс конкретно для динамического линковщика мусла
              if [ "$pkgname" = "ld-musl-x86_64.so.1" ]; then
                destdir="lib"
                is_libc="yes"
              fi

              size=$(stat -c%s "$f")
              md5=$(md5sum "$f" | cut -d' ' -f1)

              {
                echo "Package: $pkgname"
                echo "Version: 1.0"
                echo "Type: $type"
                echo "Filename: $f"
                echo "Size: $size"
                echo "MD5sum: $md5"
                echo "DestDir: $destdir"
                echo "libc: $is_libc"
                echo ""
              } >> Packages.new
            fi
          done

          echo "###AUTO_END###" >> Packages.new
          count=$(grep -c "^Package:" Packages.new)
          echo "" >> Packages.new
          echo "# Total packages: $count" >> Packages.new

          echo "Generated $count packages"

      - name: Merge with existing Packages (preserve manual edits)
        run: |
          # Если Packages не существует, просто переименовываем новый
          if [ ! -f Packages ]; then
            mv Packages.new Packages
            echo "Created new Packages file"
            exit 0
          fi

          # Разделяем существующий Packages на части
          # Часть до ###AUTO_START### (ручные правки)
          # Часть между ###AUTO_START### и ###AUTO_END### (авто-секция)
          # Часть после ###AUTO_END### (ручные правки)

          # Извлекаем заголовок (до AUTO_START)
          sed -n '1,/###AUTO_START###/p' Packages | sed '$d' > Packages.header

          # Извлекаем футер (после AUTO_END)
          sed -n '/###AUTO_END###/,$p' Packages | sed '1d' > Packages.footer

          # Собираем финальный файл
          cat Packages.header > Packages.final
          echo "###AUTO_START###" >> Packages.final
          
          # Добавляем новую авто-секцию
          sed -n '/###AUTO_START###/,/###AUTO_END###/p' Packages.new | sed '1d;$d' >> Packages.final
          
          echo "###AUTO_END###" >> Packages.final
          
          # Добавляем футер если он есть и не пустой
          if [ -s Packages.footer ]; then
            cat Packages.footer >> Packages.final
          fi

          # Заменяем файл
          mv Packages.final Packages
          rm -f Packages.new Packages.header Packages.footer

          echo "Merged changes preserving manual edits"

      - name: Show changes
        run: |
          echo "=== Packages file summary ==="
          grep "^Package:" Packages | head -20
          total=$(grep -c "^Package:" Packages)
          echo "..."
          echo "Total packages: $total"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Packages (preserve manual edits in auto-section)"
            git push
          fi
